openapi: 3.0.0
info:
  title: BursaLink API
  version: 1.0.0
  description: API for Digital Bursary Management System

paths:
  /api/auth/verify-otp:
    post:
      summary: Verify OTP and get JWT
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                otp: { type: string }
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }

  /api/applications:
    get:
      summary: List applications (Admin)
      security: [{ bearerAuth: [] }]
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Application' }
    post:
      summary: Submit application (Student)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                county: { type: string }
                documents: { type: array, items: { type: string } }

  /api/public/stats:
    get:
      summary: Public transparency statistics
      responses:
        200:
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
    Application:
      type: object
      properties:
        id: { type: string }
        studentName: { type: string }
        score: { type: integer }
        status: { type: string }